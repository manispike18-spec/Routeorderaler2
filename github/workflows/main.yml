name: RouteAlert2 APK Build

'on':
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android
    uses: android-actions/setup-android@v3

  - name: Build APK
    run: |
      ls -la
      if [ ! -f gradlew ]; then
        echo "gradlew not found. Android project files are missing."
        exit 1
      fi
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: RouteAlert2-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
